name: Compilar seeU y Crear Instalador para Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar seeU.exe e Instalador Setup
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Inno Setup (Compilador de instaladores Windows)
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar seeU.exe y generar instalador seeU-Setup-x64.exe
        run: |
          python build_windows_exe.py

      - name: Empaquetar version portable en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\seeU\* -DestinationPath dist-installer\seeU-Windows-Portable.zip

      - name: Publicar Instalador Oficial (.exe) y Version Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: seeU-Instalador-Windows
          path: |
            dist-installer/seeU-Setup-x64.exe
            dist-installer/seeU-Windows-Portable.zip
          retention-days: 30

      - name: Publicar Release Oficial en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: seeU ${{ github.ref_name }} - Lanzamiento Oficial
          files: |
            dist-installer/seeU-Setup-x64.exe
            dist-installer/seeU-Windows-Portable.zip
          body: |
            ## seeU - Supervisor Personal y Micro-Orbe Etereo

            Lanzamiento oficial empaquetado para Windows x64.

            ### Archivos para descarga
            - **seeU-Setup-x64.exe**: Instalador visual guiado con accesos directos, icono oficial y desinstalador.
            - **seeU-Windows-Portable.zip**: Paquete portable para descomprimir y ejecutar de inmediato sin instalacion.

            ### Aspectos destacados de la entrega
            - Diseno Liquid Glass con soporte de desenfoque de hardware Acrylic nativo en Windows 11 y Windows 10.
            - Cuadro de confirmacion al cerrar para evitar interrupciones o salidas accidentales.
            - Ecosistema para agentes de inteligencia artificial mediante CLI (seeu) y servidor MCP nativo stdio.
            - Inicio silencioso sin ventanas de consola CMD residuales.

