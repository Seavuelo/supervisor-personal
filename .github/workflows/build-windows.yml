name: Compilar seeU y Crear Instalador para Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar seeU.exe e Instalador Setup
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Inno Setup (Compilador de instaladores Windows)
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Compilar seeU.exe y generar instalador seeU-Setup-x64.exe
        run: |
          python build_windows_exe.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist-installer\seeU-Setup-x64.exe)) {
            throw "La compilación no produjo el instalador de Windows."
          }

      - name: Empaquetar version portable en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\seeU\* -DestinationPath dist-installer\seeU-Windows-Portable.zip

      - name: Comprobar actualización sobre seeU 1.1.2
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $oldSetup = Join-Path $env:RUNNER_TEMP 'seeU-previous.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'seeU-installed'
          Invoke-WebRequest -Uri 'https://github.com/Seavuelo/supervisor-personal/releases/download/v1.1.2/seeU-Setup-x64.exe' -OutFile $oldSetup
          $flags = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS'
          $old = Start-Process -FilePath $oldSetup -ArgumentList "$flags /DIR=`"$installDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($old.ExitCode -ne 0 -or (Get-ItemPropertyValue 'HKCU:\Software\seeU' Version) -ne '1.1.2') {
            throw "No se pudo instalar la versión anterior."
          }
          $dataDir = Join-Path $env:APPDATA 'seeU\data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $keepFile = Join-Path $dataDir 'upgrade-check.txt'
          Set-Content -LiteralPath $keepFile -Value 'keep'
          $new = Start-Process -FilePath 'dist-installer\seeU-Setup-x64.exe' -ArgumentList $flags -WindowStyle Hidden -Wait -PassThru
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installed = Get-ItemProperty 'HKCU:\Software\seeU'
          if ($new.ExitCode -ne 0 -or $installed.Version -ne $version -or
              $installed.InstallPath -ne $installDir -or !(Test-Path $installed.ExePath) -or
              (Get-Content -LiteralPath $keepFile -Raw).Trim() -ne 'keep') {
            throw "La actualización no conservó la instalación y su carpeta de datos."
          }

      - name: Publicar Instalador Oficial (.exe) y Version Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: seeU-Instalador-Windows
          path: |
            dist-installer/seeU-Setup-x64.exe
            dist-installer/seeU-Windows-Portable.zip
          retention-days: 30

      - name: Publicar Release Oficial en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: seeU ${{ github.ref_name }} - Lanzamiento Oficial
          files: |
            dist-installer/seeU-Setup-x64.exe
            dist-installer/seeU-Windows-Portable.zip
          body: |
            ## seeU - Supervisor Personal y Micro-Orbe Etereo

            Lanzamiento oficial empaquetado para Windows x64.

            ### Archivos para descarga
            - **seeU-Setup-x64.exe**: Instalador visual guiado con accesos directos, icono oficial y desinstalador.
            - **seeU-Windows-Portable.zip**: Paquete portable para descomprimir y ejecutar de inmediato sin instalacion.

            ### Cambios
            - seeU solicita un plazo de 15 segundos a Gemini para evitar el rechazo HTTP 400 por un plazo inferior al mínimo.
            - Probar conexión comprueba la clave recién pegada y conserva la clave guardada hasta que se confirme el cambio.
            - El campo acepta claves copiadas con caracteres invisibles. Los errores muestran el código y el motivo de Google sin incluir la clave.

