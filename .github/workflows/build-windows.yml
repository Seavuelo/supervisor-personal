name: Compilar seeU y Crear Instalador para Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar seeU.exe e Instalador Setup
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Inno Setup (Compilador de instaladores Windows)
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar seeU.exe y generar instalador seeU-Setup-x64.exe
        run: |
          python build_windows_exe.py

      - name: Empaquetar version portable en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\seeU\* -DestinationPath dist-installer\seeU-Windows-Portable.zip

      - name: Publicar Instalador Oficial (.exe) y Version Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: seeU-Instalador-Windows
          path: |
            dist-installer/seeU-Setup-x64.exe
            dist-installer/seeU-Windows-Portable.zip
          retention-days: 30
